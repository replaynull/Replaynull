<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carregando...</title>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    background:#000;
    color:#fff;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Arial,sans-serif;
}
</style>
</head>
<body>

<div>Carregando...</div>

<script>
const URL = "https://raw.githubusercontent.com/replaynull/Index.htm/main/Index.html";

fetch(URL)
    .then(response => response.text())
    .then(html => {
        document.open();
        document.write(html);
        document.close();
    })
    .catch(e => {
        document.body.innerHTML =
            "<h2>Erro ao carregar a página</h2><pre>" + e + "</pre>";
    });
</script>

</body>
</html>
